name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-drift:
    name: Docs drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Kept in sync with versions.json:nodeVersion by scripts/sync-versions-in-docs.mjs.
          node-version: '24.22.2'

      - name: Verify reference docs are in sync with versions.json
        run: node scripts/sync-versions-in-docs.mjs --check

      - name: Verify published workshop is in sync with workshop/
        run: node scripts/sync-workshop-docs.mjs --check

      - name: Test generator utilities and workshop synchronization
        run: node --test scripts/*.test.mjs

      - name: Test docs analytics consent
        run: node --test docs/.vuepress/analytics.test.mjs

      - name: Syntax-check scripts
        run: |
          for f in scripts/*.mjs scripts/lib/*.mjs; do
            node --check "$f"
          done
