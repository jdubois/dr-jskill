# Docker Compose file for Spring Boot development
# Place this file in your project root for automatic PostgreSQL startup
# with spring-boot-docker-compose

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-user}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    volumes:
      # PostgreSQL 18+ images require the mount at /var/lib/postgresql (not
      # /var/lib/postgresql/data), which is where they now place version-specific
      # data directories. Mounting the old path makes the container refuse to start.
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
